# H2 In-Memory Database Configuration for Automated Testing
spring.datasource.url=jdbc:h2:mem:hospital_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=CarePlusHospitalSuperSecretKeyForJwtAuthentication2026SecureKey!
app.jwt.expiration-ms=86400000
