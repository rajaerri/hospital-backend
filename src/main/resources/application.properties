# ===================================================================
# Life Care Hospital Appointment Management System
# Backend Application Configuration
# ===================================================================

# Application Information
spring.application.name=${APP_NAME:hospital-appointment-system}

# Server Port (configurable via environment variable SERVER_PORT, default 8080)
server.port=${SERVER_PORT:8080}

# CORS: Frontend origin allowed to communicate with this API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===================================================================
# JWT Security Configuration (Externalized Secrets)
# ===================================================================
app.jwt.secret=${JWT_SECRET:CarePlusHospitalSuperSecretKeyForJwtAuthentication2026SecureKey!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# Database Connection (MySQL / Persistent Store with Env Var overrides)
# ===================================================================
# Defaults to embedded persistent MySQL-mode store so the app runs immediately.
# To connect to MySQL Server, set:
#   $env:DB_URL="jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
#   $env:DB_USERNAME="root"
#   $env:DB_PASSWORD="your_password"
#   $env:DB_DRIVER="com.mysql.cj.jdbc.Driver"
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/hospital_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Hibernate JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.hospital.appointment=DEBUG
logging.level.org.springframework.security=DEBUG
